<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>변경의 영주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e3d9;--bg2:#ddd7ca;--panel:#f3f0e8;--panel2:#e8e2d5;--line:#cbc2ae;--trim:#8a6a2c;--ink:#1f1a13;--muted:#6b6355;
  --accent:#8a6a2c;--accent-ink:#f6f2e8;--good:#2c5d86;--evil:#7b3a92;--neu:#5a574f;--danger:#b23328;--warn:#a8641a;--ok:#2f7a45;
  --glow:rgba(138,106,44,.10);--sil:#c9c1af;--hudbg:rgba(231,227,217,.9);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1114;--bg2:#12161b;--panel:#181d24;--panel2:#202630;--line:#2c3340;--trim:#c9a45c;--ink:#ece5d5;--muted:#958e7f;
  --accent:#c9a45c;--accent-ink:#17130b;--good:#83b4dc;--evil:#c587db;--neu:#aaa69b;--danger:#e2604f;--warn:#e6a24c;--ok:#7cc48c;
  --glow:rgba(201,164,92,.13);--sil:#06080a;--hudbg:rgba(14,17,20,.86);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1114;--bg2:#12161b;--panel:#181d24;--panel2:#202630;--line:#2c3340;--trim:#c9a45c;--ink:#ece5d5;--muted:#958e7f;
  --accent:#c9a45c;--accent-ink:#17130b;--good:#83b4dc;--evil:#c587db;--neu:#aaa69b;--danger:#e2604f;--warn:#e6a24c;--ok:#7cc48c;
  --glow:rgba(201,164,92,.13);--sil:#06080a;--hudbg:rgba(14,17,20,.86);
  color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% -5%,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hudbg);backdrop-filter:blur(8px)}
.disp{font-family:'Song Myung','Gowun Batang',serif;font-weight:400}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--trim);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.karma-good{color:var(--good)}.karma-evil{color:var(--evil)}.karma-neutral{color:var(--neu)}
.up{color:var(--ok)}.dn{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--trim)}
.btn.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--trim);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.2)}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'Gowun Dodum',sans-serif}
.ghost:hover:not(:disabled){border-color:var(--trim);color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:24px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.slot.empty{border-style:dashed;background:transparent}
.slot .sn{font-family:'Song Myung',serif;font-size:20px;color:var(--trim)}
.slot b{font-family:'Gowun Batang',serif;font-size:18px}
.slot span{font-size:13.5px;color:var(--muted)}.slot small{font-size:12px;color:var(--muted)}
.slot .sb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.slot .sb .btn{padding:7px 14px;font-size:13.5px}
.savemsg{margin:16px 0 0;padding:10px 14px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--trim)}
.badge{font-size:12px;border:1px solid currentColor;border-radius:3px;padding:0 6px;color:var(--trim);white-space:nowrap;font-family:'Gowun Dodum',sans-serif}
.chip{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:999px;border:1px solid currentColor;margin-left:4px;white-space:nowrap;vertical-align:1px}

/* 타이틀 */
.title{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px 240px;overflow:hidden}
.moon{position:absolute;top:12%;right:14%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--trim),transparent 70%);opacity:.35;filter:blur(2px)}
.title .inner{position:relative;z-index:2;animation:rise 1.6s ease-out both}
.title h1{font-family:'Song Myung',serif;font-weight:400;font-size:clamp(64px,13vw,136px);line-height:1;margin:0;letter-spacing:.02em}
.title .sub{max-width:28em;margin:20px auto 32px;color:var(--muted);font-family:'Gowun Batang',serif;font-size:17px;line-height:1.8}
.title .menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.title .btn{padding:13px 30px;font-size:16px}
.title .meta{margin-top:26px;color:var(--muted);font-size:13px}
.horizon{position:absolute;left:0;right:0;bottom:0;height:240px;color:var(--sil);z-index:1}
.horizon svg{width:100%;height:100%;display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 부임 준비 */
.setup{max-width:1020px;margin:0 auto;padding:40px 20px 90px}
.setup h1{font-family:'Song Myung',serif;font-weight:400;font-size:48px;margin:0 0 4px}
.setup .lead{color:var(--muted);margin:0}
.sec{margin-top:36px}
.sec h2{font-family:'Song Myung',serif;font-weight:400;font-size:26px;margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2 small{font-family:'Gowun Dodum',sans-serif;font-size:13.5px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:14px}
.pick{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:15px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--trim)}
.pick b{display:block;font-family:'Gowun Batang',serif;font-weight:700;font-size:17px;margin-bottom:4px;padding-right:16px}
.pick span{color:var(--muted);font-size:13.5px;line-height:1.55}
.pick.on{border-color:var(--trim);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--trim)}
.pick.on::after{content:"";position:absolute;top:16px;right:14px;width:9px;height:9px;transform:rotate(45deg);background:var(--trim)}
.namein{font-family:'Song Myung',serif;font-size:30px;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--ink);padding:4px 2px;width:min(360px,100%);margin-top:10px}
.namein:focus{outline:none;border-color:var(--trim)}
.setup .go{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.setup .go .btn.gold{padding:13px 34px;font-size:16px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hudbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1440px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.realm-name{display:flex;align-items:center;gap:8px;min-width:0}
.realm-name .disp{font-size:24px;line-height:1.1;white-space:nowrap}
.resbar{display:flex;gap:6px;flex:1;flex-wrap:wrap;min-width:0}
.res{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.res .ic{color:var(--trim);width:16px;height:16px}
.res .rl{font-size:12px;color:var(--muted)}
.res b{font-variant-numeric:tabular-nums;font-size:14.5px}
.res em{font-style:normal;font-size:11.5px}
.clock{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.pips{display:flex;gap:6px;padding:0 2px}
.pip{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--trim);background:var(--trim)}
.pip.off{background:transparent;opacity:.45}
@media (max-width:760px){.res .rl{display:none}.resbar{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}.realm-name .disp{font-size:20px}.clock{margin-left:auto}}

/* 보드 */
.board{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:18px;max-width:1440px;margin:0 auto;padding:18px 16px 40px}
@media (max-width:1160px){.board{grid-template-columns:230px minmax(0,1fr)}.side{grid-column:1/-1;display:grid!important;grid-template-columns:1fr 1fr}}
@media (max-width:760px){.board{grid-template-columns:1fr;gap:14px;padding:12px 10px 30px}.stage{order:1}.realm{order:2}.side{order:3;grid-template-columns:1fr!important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ptitle{font-family:'Song Myung',serif;font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptitle .ic{color:var(--trim)}
.realm{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:1160px){.realm{position:static}}
.meter{margin:9px 0 0}
.meter .mk{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .mk b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--trim);border-radius:3px}
.threat .ptitle .ic{color:var(--danger)}
.threat .track{height:10px;background:linear-gradient(90deg,var(--panel2) 0 30%,color-mix(in srgb,var(--warn) 20%,var(--panel2)) 30% 60%,color-mix(in srgb,var(--danger) 22%,var(--panel2)) 60% 90%,color-mix(in srgb,var(--danger) 40%,var(--panel2)) 90%)}
.threat .track i{background:var(--danger)}
.threat .lvl{font-size:13px;color:var(--danger);margin-top:6px}
.karma{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.karma span{font-size:12.5px;text-align:center;padding:5px 0;border-radius:4px;background:var(--panel2);color:var(--muted)}
.karma span.on.evil{background:color-mix(in srgb,var(--evil) 22%,var(--panel2));color:var(--evil);font-weight:700}
.karma span.on.neutral{background:color-mix(in srgb,var(--neu) 25%,var(--panel2));color:var(--ink);font-weight:700}
.karma span.on.good{background:color-mix(in srgb,var(--good) 22%,var(--panel2));color:var(--good);font-weight:700}
.kdesc{font-size:13px;margin-top:6px;font-family:'Gowun Batang',serif}
.drow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px}
.drel{display:flex;gap:4px;margin-top:5px}.drel i{flex:1;height:6px;border-radius:2px;background:var(--panel2)}.drel i.on{background:var(--evil)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:none;padding:7px 6px;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--trim)}
.tip{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}

/* 스테이지 */
.stage{min-width:0}
.views{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.views button{background:none;border:0;padding:8px 14px 10px;font-family:'Song Myung',serif;font-size:18px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.views button.on{color:var(--ink);border-color:var(--trim)}
.views button small{font-family:'Gowun Dodum',sans-serif;font-size:12px;margin-left:4px;color:var(--trim)}
.letter{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--trim);border-radius:4px 10px 10px 4px;padding:14px 18px;margin-bottom:14px}
.letter .from{font-family:'Song Myung',serif;font-size:17px;color:var(--trim);margin-bottom:4px}
.letter ul{list-style:none;margin:0;padding:0;font-family:'Gowun Batang',serif;font-size:15px;line-height:1.75}
.letter li{padding-left:16px;position:relative}
.letter li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;transform:rotate(45deg);background:var(--muted)}
.letter li.warn{color:var(--warn)}.letter li.warn::before{background:var(--warn)}
.outcome{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-radius:10px;padding:11px 16px;margin-bottom:14px;background:color-mix(in srgb,var(--ok) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.outcome.fail{background:color-mix(in srgb,var(--danger) 9%,var(--panel));border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.outcome b{white-space:nowrap}.outcome.fail b{color:var(--danger)}.outcome b{color:var(--ok)}
.outcome span{flex:1;min-width:200px}
.cats{margin-bottom:12px}
.plaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.plaque{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:108px;transition:border-color .15s,transform .15s,background .15s}
.plaque:hover:not(:disabled){border-color:var(--trim);background:var(--panel2);transform:translateY(-1px)}
.plaque:disabled{opacity:.42;cursor:not-allowed}
.plaque .pt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plaque b{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px}
.plaque p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.plaque em{font-style:normal;font-size:12px;color:var(--danger)}
.odds{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.o-hi{color:var(--ok)}.o-mid{color:var(--trim)}.o-lo{color:var(--warn)}.o-vlo{color:var(--danger)}
.lineup{font-size:13px;color:var(--muted);margin:12px 2px 0}
.endturn{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;background:var(--panel2);border:1px solid var(--trim);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.endturn span{font-size:13.5px;color:var(--muted)}
.endturn .btn{padding:12px 26px;font-size:15.5px}

/* 사건 두루마리 */
.scroll{background:var(--panel);border:1px solid var(--trim);border-radius:12px;overflow:hidden;animation:unroll .35s ease-out;box-shadow:0 14px 40px rgba(0,0,0,.18)}
@keyframes unroll{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll-head{display:flex;align-items:center;gap:16px;padding:20px 26px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.emblem{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;color:var(--trim);background:var(--bg2)}
.emblem .ic{width:26px;height:26px}
.k-battle .emblem{color:var(--danger)}.k-demon .emblem{color:var(--evil)}
.k-battle{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}.k-demon{border-color:color-mix(in srgb,var(--evil) 55%,var(--line))}
.scroll-head .tag{font-size:13px;color:var(--muted)}
.scroll-head h2{font-family:'Song Myung',serif;font-weight:400;font-size:clamp(26px,3.6vw,34px);line-height:1.15;margin:0}
.scroll-body{padding:18px 26px 24px}
.story{font-family:'Gowun Batang',serif;font-size:16.5px;line-height:1.9;max-width:36em}
.story p{margin:0 0 10px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--trim);background:var(--panel2)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice.sel{opacity:1;border-color:var(--trim);background:var(--panel2)}
.choice .cl{flex:1;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:15px}
.choice small{font-weight:400;font-size:12.5px;color:var(--muted)}
.wax{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;line-height:1.1;color:#f7efe1;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--wc) 70%,#fff) 0,var(--wc) 55%,color-mix(in srgb,var(--wc) 70%,#000) 100%);box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 3px color-mix(in srgb,var(--wc) 60%,#000)}
.wax.hi{--wc:#3c7a4c}.wax.mid{--wc:#8d6b25}.wax.lo{--wc:#a2591b}.wax.vlo{--wc:#902b25}
.wax.busy{--wc:#545a66;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);animation:unroll .25s ease-out}
.result .chosen{font-size:13px;color:var(--trim);margin-bottom:6px}
.blog{list-style:none;margin:12px 0 0;padding:10px 14px;background:var(--bg2);border-radius:8px;font-size:13.5px;max-height:300px;overflow:auto}
.blog li{padding:4px 0;border-bottom:1px dashed var(--line)}.blog li:last-child{border:0}
.blog .lb{color:var(--trim);font-weight:700}.blog .win{color:var(--ok);font-weight:700}.blog .lose{color:var(--danger);font-weight:700}
.cont{margin-top:18px}
.scroll.still,.result.still{animation:none}
.scroll,.stage{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:760px){.scroll,.stage{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}}
.judging{display:flex;align-items:center;gap:14px;margin-top:12px;font-family:'Gowun Batang',serif;color:var(--muted)}
.blog li.fresh,.story.fresh{animation:lineIn .28s ease-out}
.blog li.pending{color:var(--muted);border:0;animation:blink 1s infinite}
@keyframes lineIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.3}}

/* 두루마리 */
.scroll{--ink:#2b2013;--muted:#6f5c41;--line:#cdb88c;--panel:#f6ead0;--panel2:#ecdcb6;--bg2:#efe1c0;--trim:#8a6424;--accent:#8a6424;--accent-ink:#fbf3df;--ok:#2e6a3d;--danger:#9c2d22;--warn:#975914;--evil:#6c2f82;--good:#2a5679;--neu:#5d5648;
  color:var(--ink);position:relative;margin:28px 14px 36px;border:0!important;border-radius:3px;overflow:visible;
  background:linear-gradient(90deg,rgba(110,72,30,.24),rgba(110,72,30,0) 5%,rgba(110,72,30,0) 95%,rgba(110,72,30,.24)),radial-gradient(ellipse at 25% 15%,#fbf1da 0,#f0e0bb 45%,#e0c896 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.08);
  animation:unrollScroll .7s cubic-bezier(.2,.7,.2,1) both}
.scroll::before,.scroll::after{content:"";position:absolute;left:-18px;right:-18px;height:24px;border-radius:12px;z-index:2;pointer-events:none;

    evo:{c:(g,c)=>g.nb.some(n=>n.emp==='frost'&&(n.status==='absorbed'||n.status==='vassal')),t:'서리를 꺾은 자',up:2,min:5,cap:6,m:1.2,x:'자신을 쫓아낸 서리왕관의 깃발이 영주의 발아래 꺾였다. 시그룬의 방패가 처음으로 빛을 냈다.',epi:'서리를 꺾은 자 시그룬은 북방의 노래 속에서 배신자가 아닌 영웅으로 불리게 되었다.',alt:{t:'얼음 학살자',m:1.3,x:'자신을 쫓아낸 서리왕관의 깃발을 꺾은 날, 시그룬은 항복한 자들까지 모두 얼음 바다에 던졌다.',epi:'얼음 학살자 시그룬의 이름은 북방에서 저주의 말이 되었다.'}}},
  amir:{name:'아미르 알하산',type:'mage',grade:3,cap:6,karma:20,conv:.4,bio:'술탄의 궁정에서 도망친 천문 마법사. 별을 읽어 다가올 재앙을 먼저 안다.',cond:g=>g.fac.tower>=2&&g.nb.some(n=>n.known&&n.emp==='safar'),
    evo:{c:(g,c)=>g.st.sold>=60&&g.fac.tower>=6,t:'별의 예언자',up:2,min:6,cap:8,m:1.2,x:'마탑 꼭대기에서 아미르가 하늘을 올려다보았다. 별들이 그에게 대륙의 운명을 속삭이기 시작했다.',epi:'별의 예언자 아미르의 예언서는 술탄도 황제도 몰래 사 읽었다.',alt:{t:'흉성의 예언자',m:1.25,x:'아미르가 별들에게서 재앙만을 골라 읽기 시작했다. 그가 예언한 재앙은 반드시 일어났다. 그가 일으켰으니까.',epi:'흉성의 예언자 아미르의 예언은 언제나 피로 실현되었다.'}}},
  theo:{name:'테오 브라이언',type:'knight',grade:1,cap:4,karma:80,conv:.7,bio:'교국에서 파견된 어린 성기사. 영주를 감시하라는 밀명을 품고 왔다.',cond:g=>g.karma>=20&&g.nb.some(n=>n.known&&n.emp==='lucien'),
    evo:{c:(g,c)=>c.loyalty>=95&&g.karma>=60,t:'변경의 성기사',up:2,min:4,cap:6,m:1.2,x:'테오가 교국에서 온 밀서를 불태웠다. “이제 제가 지킬 곳은 이 영지입니다.”',epi:'변경의 성기사 테오는 교국의 명보다 영주와의 약속을 끝까지 지켰다.',alt:{c:(g,c)=>c.loyalty>=95&&g.karma<=-60,t:'피의 심문관장',m:1.3,x:'테오가 교국에서 배운 모든 심문 기술을 영주의 적에게 쏟았다. 교국은 그를 가장 위험한 배교자로 선포했다.',epi:'피의 심문관장 테오의 이름은 교국의 금서 첫 장에 올랐다.'}}},
  rahel:{name:'라헬',type:'knight',grade:2,cap:5,karma:-30,conv:.3,bio:'안개섬 해적단을 배신하고 도망친 항해사. 곁에 있으면 마석을 더 비싸게 판다.',cond:g=>g.nb.some(n=>n.known&&(n.id==='mistisle'||n.id==='sandquill'))},
  gideon:{name:'기드온 레이븐',type:'knight',grade:5,cap:6,karma:30,conv:.6,bio:'은퇴한 제국 근위대장. 황제의 명으로 변경을 살피러 왔다. 곁에 두면 제국의 신임이 쌓인다.',cond:g=>g.rank>=2&&g.favor>=60},
  mira:{name:'미라',type:'mage',grade:0,cap:8,karma:10,conv:.3,bio:'말수가 적은 시골 소녀. 그녀 주변에서는 촛불이 저절로 켜진다.',cond:g=>g.pop>=700,
    evo:{c:(g,c)=>c.battles>=10&&c.grade>=4,t:'불꽃의 마녀',up:2,min:6,cap:8,m:1.25,x:'전장 한가운데서 미라의 눈동자가 붉게 타올랐다. 그녀를 둘러싼 불꽃이 하늘까지 치솟았다.',epi:'불꽃의 마녀 미라는 촛불 하나로 시작해 대륙의 밤을 밝혔다.',alt:{t:'재앙의 마녀',m:1.3,x:'자신을 마녀라 손가락질하던 사람들의 얼굴이 떠오르자, 미라의 불꽃이 하늘을 태웠다.',epi:'재앙의 마녀 미라는 자신을 버린 세상을 불태웠다.'}}},
  grom:{name:'그롬',type:'knight',grade:3,cap:5,karma:-10,conv:.5,bio:'서리늑대 부족에서 쫓겨난 전사. 잿빛 늑대 한 마리가 늘 곁을 따른다. 마물 토벌에 능하다.',cond:g=>g.nb.some(n=>n.known&&n.id==='frostwolf')},
  selene:{name:'셀렌',type:'mage',grade:5,cap:6,karma:-40,conv:.6,bio:'밤에만 모습을 드러내는 달의 마녀. 마족의 언어를 안다.',cond:g=>g.demonMet&&g.mana>=40,
    evo:{c:(g,c)=>g.asmorDown&&g.demonRel===0,t:'달빛의 퇴마사',up:2,min:7,cap:8,m:1.25,x:'아스모르가 쓰러진 밤, 셀렌이 오랫동안 숨겨 온 이름을 불렀다. 달빛이 그녀의 그림자를 씻어 냈다.',epi:'달빛의 퇴마사 셀렌은 마족의 언어로 마족을 몰아냈다.',alt:{c:(g,c)=>g.demonRel>=3,t:'마족의 달',m:1.3,x:'셀렌이 마족의 언어로 마지막 맹세를 읊었다. 달이 붉게 물들고, 그녀의 그림자가 마족의 형상을 띠었다.',epi:'마족의 달 셀렌은 아스모르의 곁에서 밤을 다스렸다.'}}},
  bastian:{name:'바스티안 로렌츠',type:'knight',grade:0,cap:6,karma:40,conv:.4,bio:'몰락한 귀족 가문의 막내. 칼보다 책을 좋아하지만 전술 감각이 남다르다.',cond:g=>g.fame>=40||g.trait==='noble',
    evo:{c:(g,c)=>c.post==='commander'&&g.rank>=3,t:'변경의 대원수',up:3,min:4,cap:6,m:1.25,x:'후작의 기사단장이 된 바스티안이 지도 위에 마지막 진형을 그렸다. 책상물림이라 비웃던 이들이 고개를 숙였다.',epi:'변경의 대원수 바스티안의 전술서는 제국 사관학교의 교본이 되었다.',alt:{t:'살육의 대원수',m:1.3,x:'후작의 기사단장이 된 바스티안이 마지막 진형을 그렸다. 그 진형에는 아군의 희생도 숫자로만 적혀 있었다.',epi:'살육의 대원수 바스티안은 승리를 위해 무엇이든 바쳤다.'}}},
  ozric:{name:'오즈릭',type:'mage',grade:2,cap:4,karma:-10,conv:.2,bio:'수상한 연금술사. 마석으로 금을 만든다고 떠벌린다. 실제로 매달 조금씩 만들어 낸다.',cond:g=>g.stones>=30},
  severin:{name:'세베린 그레이브',type:'knight',grade:3,cap:5,karma:70,conv:.85,inq:1,bio:'교국에서 파견된 이단심문관. 마기의 냄새를 맡으면 끝까지 쫓는다.',cond:g=>false},
  matheus:{name:'마테우스 노바',type:'mage',grade:6,cap:8,karma:75,conv:.95,inq:1,bio:'이단심문 본대를 이끄는 대심문관. 그의 성화 앞에서 거짓을 말한 자는 없다.',cond:g=>false},
  isabel:{name:'이자벨 크로스',type:'knight',grade:4,cap:6,karma:65,conv:.8,inq:1,bio:'본대의 처형인. 이단의 목을 칠 때만 투구를 벗는다.',cond:g=>false},
  kain:{name:'케인 아이언베일',type:'knight',grade:5,cap:6,karma:60,conv:.85,inq:1,bio:'강철 장막이라 불리는 본대의 방패. 그가 선 곳은 한 발짝도 뚫린 적이 없다.',cond:g=>false},
  ophelia:{name:'오필리아 레인',type:'mage',grade:4,cap:7,karma:80,conv:.75,inq:1,bio:'금서를 불태우는 성가대의 마법사. 이단의 지식을 가장 많이 아는 자다.',cond:g=>false},
  nepheris:{name:'네페리스',type:'mage',grade:5,cap:8,karma:-85,conv:.9,bio:'마족과의 계약으로 서클을 쌓아 올리는 흑마법사.',cond:g=>g.karma<=-60&&!!g.flags.forbidden}
};

const FORMS={
  serion:{evil:{t:'타락한 성기사',m:1.3,x:'세리온의 성검이 검게 물들었다. 기도 대신 저주가 그의 입에서 흘러나온다. 빛을 지키던 검이 이제 어둠을 벤다.',epi:'타락한 성기사 세리온은 한때 지키던 모든 것을 베어 넘겼다.'}},
  elina:{evil:{t:'피의 치유사',m:1.1,x:'엘리나의 손끝에서 흐르던 빛이 붉게 변했다. 이제 그녀는 누군가의 피를 대가로만 상처를 낫게 한다.',epi:'피의 치유사 엘리나의 손길에는 늘 대가가 따랐다.'}},
  bram:{evil:{t:'피에 젖은 교관',m:1.1,x:'브람의 훈련장에서 처음으로 죽은 제자가 나왔다. 노기사는 눈 하나 깜빡이지 않았다.',epi:'피에 젖은 교관 브람의 제자들은 자비를 배우지 못했다.'}},

  kashan:{good:{t:'결계 연구가',m:1.1,x:'카샨이 금지 연구 노트를 덮었다. 그의 마법진은 이제 무언가를 부수는 대신 감싸 안는다.',epi:'결계 연구가 카샨의 결계는 백 년 뒤에도 변경을 감싸고 있었다.'},evil:{t:'금지술사',m:1.2,x:'카샨이 마지막 금기를 넘었다. 탑에서 검은 불꽃이 솟구쳤다.',epi:'금지술사 카샨의 탑에서는 밤마다 검은 불꽃이 피어올랐다.'}},
  bargul:{good:{t:'속죄의 기사',m:1.1,x:'바르굴이 학살했던 마을의 무덤 앞에 무릎을 꿇었다. 그는 처음으로 울었고, 다시 일어섰을 때 그의 검은 누군가를 지키고 있었다.',epi:'속죄의 기사 바르굴은 지난날의 피를 씻기 위해 늘 가장 먼저 전장에 섰다.'}},
  rowen:{good:{t:'숲의 파수꾼',m:1.15,x:'로웬이 처음으로 마물이 아닌 사람을 위해 활을 들었다. 길 잃은 아이들을 숲 밖으로 데려다주며 그는 오랜만에 웃었다.',epi:'숲의 파수꾼 로웬은 다시는 아무도 잃지 않았다.'},evil:{t:'증오의 사냥꾼',m:1.1,x:'로웬의 화살이 마물이 아닌 사람을 겨눴다. 복수심이 그를 삼켜 버렸다.',epi:'증오의 사냥꾼 로웬은 인간과 마물을 가리지 않게 되었다.'}},
  nepheris:{good:{t:'빛을 본 마녀',m:1.15,x:'네페리스가 마족의 계약서를 들고 떨고 있다. 처음으로 그녀의 마법진에서 빛이 새어 나왔다.',epi:'빛을 본 마녀 네페리스는 처음으로 계약 없이 빛을 다루는 법을 배웠다.'}},
  morte:{good:{t:'망자의 인도자',m:1.2,x:'모르테가 처음으로 산 자를 위해 기도했다. 그의 사령술은 이제 길 잃은 영혼을 저승으로 인도한다. 무덤가의 망령들이 하나둘 평온히 사라졌다.',epi:'망자의 인도자 모르테 덕분에 변경의 무덤에서는 더 이상 망령이 떠돌지 않았다.'}},
  selene:{good:{t:'새벽의 마녀',m:1.2,x:'밤에만 걷던 셀렌이 처음으로 해가 뜨는 것을 지켜보았다. 그녀의 달빛 마법에 새벽의 빛이 섞여 들었다.',epi:'새벽의 마녀 셀렌은 낮에도 영지의 경계를 걸었다.'}},
  rahel:{good:{t:'변경의 제독',m:1.15,x:'라헬이 해적 깃발을 불태우고 영지의 깃발을 돛대에 올렸다. 이제 그녀의 배는 약탈이 아닌 호위를 위해 바다로 나간다.',epi:'변경의 제독 라헬은 해적선을 몰아내는 함대를 이끌었다.'}},
  lumina:{evil:{t:'검은 침묵',m:1.25,x:'루미나의 치유의 빛이 꺼지고, 그 자리에 차가운 어둠이 고였다. 그녀가 손을 얹은 상처는 이제 썩어 들어간다. 그녀는 여전히 아무 말도 하지 않는다.',epi:'검은 침묵 루미나가 머문 마을에는 역병이 끊이지 않았다.'}},
  elke:{evil:{t:'그림자 검사',m:1.2,x:'엘케가 동경하던 등을 쫓는 것을 그만두었다. 그녀의 검은 이제 빛을 반사하지 않는다.',epi:'그림자 검사 엘케는 누구의 뒤도 쫓지 않고 어둠 속을 걸었다.'}},
  theo:{evil:{t:'배교의 심문관',m:1.25,x:'테오가 교국의 성표를 짓밟았다. 교국에서 배운 심문 기술은 이제 영주의 적들을 향한다.',epi:'배교의 심문관 테오의 이름은 교국의 금서 목록에 올랐다.'}},

function tryLB(c,o){

function fighters(){return g.chars.filter(c=>!c.injured&&c.hp>0&&!c.bench).sort((a,b)=>powerOf(b)-powerOf(a)).slice(0,6)}
function charMult(c,mode,kind){let m=1;if(mode==='intercept')m=c.type==='knight'?1.4:.9;if(mode==='barrier')m=c.type==='mage'?(c.id==='kashan'&&c.align==='good'?2.6:2):.7;if(kind==='monster'&&c.id==='rowen')m*=1.5;return m}
const troopsAll=()=>g.troops+(g.shadow?g.shadow.n:0);
function sidePower(team,mode,kind,frac=1){
  let t=troopsAll()*.6*frac;if(kind==='monster'&&g.wars.length)t*=.6;
  let cp=0;team.forEach(c=>{if(c.hp>0)cp+=powerOf(c)*3*charMult(c,mode,kind)});
  let tot=t+cp;
  if(mode==='siege')tot=tot*(1+g.fac.wall*.12)+10;
  if(postHolder('commander'))tot*=1.1;
  if(g.prep&&kind==='monster')tot*=1.15;
  if(kind==='monster'&&g.fac.sanctum&&facActive('sanctum'))tot*=1+g.fac.sanctum*.03;
  if(g.flags.order&&mode==='siege')tot*=1.15;
  if(kind==='war')tot+=kn().filter(n=>n.ally&&n.status==='peace').reduce((a,n)=>a+n.power*.3,0);
  if(g.demonRel>=4&&kind!=='coalition'&&kind!=='empire')tot+=30;
  return Math.max(1,tot);
}
function roundP(our,en){en*=D().en;return clamp(.5+(our-en)/(our+en)*.6+(g.advisor==='captain'?.05:0)+(g.trait==='hero'?.03:0),.08,.92)}
function winChance(p){let s=0;for(let k=0;k<=3;k++)s+=comb(2+k,k)*p**3*(1-p)**k;return s}
const ODDS=new Map();
function battleOdds(en,mode,kind){
  const team=fighters();
  const key=[en,mode,kind,troopsAll(),g.wars.length,g.prep?1:0,g.fac.wall,g.fac.sanctum,g.flags.order?1:0,g.demonRel,g.diff,g.advisor,g.trait,(postHolder('commander')||{}).uid,g.nb.filter(n=>n.ally&&n.status==='peace').length,facActive('sanctum')?1:0,team.map(c=>[c.uid,c.grade,c.hp,c.eq||0,c.formMult||1].join(':')).join('|')].join(',');
  if(ODDS.has(key))return ODDS.get(key);
  let sd=1234567;const rng=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const s0=Math.max(1,Math.round(troopsAll()/10)),init=s0+team.length,N=600;let wins=0;
  for(let k=0;k<N;k++){
    const cl=team.map(c=>Object.assign({},c));let sq=s0,ehp=100,win=false;
    const alive=()=>sq+cl.filter(c=>c.hp>0).length;
    for(let r=1;r<=7;r++){
      const p=roundP(sidePower(cl,mode,kind,sq/s0),en);
      if(rng()<p){ehp-=28+Math.floor(rng()*15);cl.forEach(c=>{if(c.hp>0)c.hp=Math.max(1,c.hp-Math.floor(rng()*13))});if(rng()<.15&&sq>0)sq--}
      else{const ls=Math.min(sq,Math.max(1,Math.round(s0*(18+Math.floor(rng()*11))/100)));sq-=ls;cl.forEach(c=>{if(c.hp>0)c.hp=Math.max(0,c.hp-(15+Math.floor(rng()*21)))})}
      if(cl.some(c=>c.id==='bargul'&&c.hp>0)&&rng()<.25&&sq>0)sq--;
      if(ehp<=0){win=true;break}
      if(alive()/init<.25||alive()===0)break;
    }
    if(win)wins++;
  }
  const v=clamp(Math.round(wins/N*100),1,99);
  if(ODDS.size>300)ODDS.clear();ODDS.set(key,v);return v;
}
function foeWord(en){const r=en*D().en/sidePower(fighters(),'siege','monster');return r<.6?'얕볼 만하다':r<1?'버거울 수 있다':r<1.6?'강대하다':'절망적이다'}
function runBattle(o){
  const team=fighters();const s0=Math.max(1,Math.round(troopsAll()/10));let sq=s0;const init=s0+team.length;let ehp=100;let win=false;const L=[];
  team.forEach(c=>c._lb=false);
  const alive=()=>sq+team.filter(c=>c.hp>0).length;
  if(o.mode==='barrier')g.mana=Math.max(0,g.mana-15);
  L.push({t:`아군: 병력 ${s0}개 분대${team.length?', '+team.map(dispName).join(', '):''}`});
  for(let r=1;r<=7;r++){
    const p=roundP(sidePower(team,o.mode,o.kind,sq/s0),o.enemy);
    if(R()<p){ehp-=ri(28,42);team.forEach(c=>{if(c.hp>0)c.hp=Math.max(1,c.hp-ri(0,12))});if(R()<.15&&sq>0)sq--;L.push({t:`${r}합: 우세. ${o.foe}에게 큰 타격을 입혔다.`})}
    else{const ls=Math.min(sq,Math.max(1,Math.round(s0*ri(18,28)/100)));sq-=ls;L.push({t:`${r}합: 열세. 아군 ${ls}개 분대가 무너졌다.`});team.forEach(c=>{if(c.hp>0){c.hp=Math.max(0,c.hp-ri(15,35));if(c.hp===0)L.push({t:`${J(dispName(c),'이','가')} 쓰러졌다.`})}})}
    if(team.some(c=>c.id==='bargul'&&c.hp>0)&&R()<.25&&sq>0){sq--;g.morale-=2;L.push({t:'바르굴이 승리를 위해 아군 분대를 미끼로 던졌다.'})}
    const ratio=alive()/init;const down=team.some(c=>c.hp===0);
    for(const c of team){if(c.hp>0&&c.hp<50&&ratio<.5&&tryLB(c,{castle:o.castle,ratio,down})){ehp-=40;c.hp=Math.min(100,c.hp+30);L.push({t:`★ 한계 돌파! ${dispName(c)}의 ${c.type==='knight'?'검':'마력'}이 그릇을 깨고 ${gradeName(c)}에 닿았다.`,c:'lb'})}}
    if(ehp<=0){win=true;break}
    if(alive()/init<.25||alive()===0)break;
  }
  L.push(win?{t:'승리했다.',c:'win'}:{t:'패배했다.',c:'lose'});
  const lost=s0-sq;let lt=Math.round(lost*10*.7);if(g.shadow){const a=Math.min(g.shadow.n,lt);g.shadow.n-=a;lt-=a;if(g.shadow.n<=0)g.shadow=null}g.troops=Math.max(0,g.troops-lt);
  for(const c of team){
    c.battles++;if(c.id==='weild')c.loyalty=Math.min(100,c.loyalty+5);addExp(c,10);
    if(c.hp===0){if(R()<.25){kill(c,'전사');L.push({t:`${J(dispName(c),'은','는')} 돌아오지 못했다.`,c:'lose'})}else{c.injured=3;c.hp=30;L.push({t:`${dispName(c)} 중상, 3개월 동안 움직일 수 없다.`})}}
    else if(c._lb&&R()<.4){c.injured=3;L.push({t:`${J(dispName(c),'은','는')} 한계 돌파의 반동으로 몸져누웠다. (3개월)`})}
  }
  return {win,lines:L,lost,team};
}

function initSignPad(){

function alignMult(a){const lk=alignOf(g.karma),deep=Math.abs(g.karma)>=70;if(lk==='good')return {good:deep?2:1.5,neutral:1.3,evil:1}[a];if(lk==='evil')return {good:1,neutral:1,evil:deep?2:1.5}[a];return 1}
function encounter(boost){
  const cand=Object.keys(NAMED).filter(id=>!hasNamed(id)&&!g.deadNamed.includes(id)&&!g.goneNamed.includes(id)&&!g.hostileNamed.includes(id)&&NAMED[id].cond(g));
  if(cand.length&&R()<.3+g.fac.inn*.05){const id=wpick(cand,x=>alignMult(alignOf(NAMED[x].karma)));return makeNamed(id)}
  const kp=clamp(.5+g.fac.barracks*.05-g.fac.tower*.05-(g.trait==='tower'?.2:0),.2,.8);const type=R()<kp?'knight':'mage';
  const tier=wpick([0,1,2,3,4,5,6],t=>[40,28,16,8,4,1.5,.5][t]*(1+g.fame/40*t/3)*(1+g.fac.inn*.1*t/3)*(t>=boost?1:.2));
  const grade=type==='knight'?tier:pk(MT.map((v,i)=>v===tier?i:-1).filter(i=>i>=0));
  const al=wpick(['good','neutral','evil'],a=>({good:30,neutral:45,evil:25}[a])*alignMult(a));
  return makeGeneric(type,grade,{align:al});
}
function reqCheck(c){
  let t=tierOf(c);if(g.advisor==='captain'&&c.type==='knight')t=Math.max(0,t-1);

}

    ch('둥지를 불태운다',()=>{const b=runBattle({enemy:en,mode:'intercept',kind:'monster',foe:'둥지의 마물'});if(!b.win)return {text:'둥지를 지키던 마물들에게 밀려났다.',lines:b.lines};g.nests++;g.threat-=12;g.stones+=3;let t=`둥지가 불타올랐다. 위협도 -12, 마석 +3.`;if(g.nests>=3&&g.source===0){g.source=1;t+='\n\n세 둥지의 잔해가 모두 한 방향을 가리킨다. 마물의 근원을 찾아냈다. (탐사: 마물 근원 공략 해금)'}return {text:t,lines:b.lines}},{p:()=>battleOdds(en,'intercept','monster')}),

/* ================= 침공 ================= */
function invasionCard(s){
  const en=Math.round([20,45,95,190][s]*(1+(g.year-1)*.06));
  const mk=(mode,label,note)=>ch(label,()=>invasionResolve(s,en,mode),{p:()=>battleOdds(en,mode,'monster'),note});
  const cs=[mk('siege','성벽에 의지해 수성한다',s<2?'외곽 마을 피해는 감수해야 한다':'성벽 단계가 높을수록 유리'),mk('intercept','기사들과 함께 출격해 요격한다','이기면 마석을 더 얻는다')];
  if(g.chars.some(c=>c.type==='mage'))cs.push(Object.assign(mk('barrier','마법 결계를 펼친다','마력 기반 -15'),{mage:true}));
  cs.push(ch('주민을 대피시킨다',()=>evacuate(s),{note:'전투 없음. 식량과 시설 피해'}));
  return {tag:'침공',title:SCALE[s],kind:'battle',text:`${pk(INV_TXT[s])}\n\n적의 기세: ${foeWord(en)}.${g.wars.length?' 전쟁에 병력이 묶여 있어 방어가 약하다.':''}`,choices:cs};
}
function invasionResolve(s,en,mode){
  const b=runBattle({enemy:en,mode,kind:'monster',castle:s>=2,foe:'마물 무리'});let t;
  if(b.win){
    const f=[2,4,7,12][s];let st=[2,5,10,22][s];if(mode==='intercept')st+=Math.ceil(st/2);
    if(s===3)b.team.forEach(c=>{if(g.chars.includes(c))c.cataWins=(c.cataWins||0)+1});
    g.fame+=f;g.stones+=st;g.threat-=[10,20,35,50][s];g.favor+=[1,3,6,10][s];g.invWins[s]++;
    t=`${SCALE[s]}을 막아냈다! 명성 +${f}, 마석 +${st}.`;
    if(mode==='siege'&&s<2){g.food-=15;t+=' 외곽 마을이 약탈당해 식량 -15.'}
    fighters().forEach(c=>{if(c.id==='rowen')c.loyalty+=5});
  }else{g.flags.lostInv=true;t=loseInvasion(s)}
  g.prep=false;
  return {text:t,lines:b.lines};
}
function loseInvasion(s){
  if(s===0){g.food-=30;g.pop*=.97;return '마물들이 외곽을 휩쓸고 돌아갔다. 식량 -30, 인구 3% 감소.'}
  if(s===1){g.pop*=.92;const d=damageFac(1);return `여러 마을이 불탔다. 인구 8% 감소${d.length?`, ${d.join(', ')} 파손`:''}.`}
  if(s===2){g.pop*=.85;const d=damageFac(2);g.castleDamage++;g.threat-=10;if(g.castleDamage>=2){g.endingNow='fallen';return '영주성이 다시 한번 무너졌다. 더는 버틸 힘이 없다.'}return `영주성의 성벽 일부가 무너졌다. 인구 15% 감소${d.length?`, ${d.join(', ')} 파손`:''}. 한 번 더 무너지면 끝이다.`}
  g.endingNow='fallen';return '재앙이 성벽을 넘었다.';
}
function evacuate(s){
  g.prep=false;
  if(s===3){g.pop*=.8;g.food=Math.round(g.food*.4);const d=damageFac(3);g.threat-=20;return `재앙은 텅 빈 마을을 짓밟고 지나갔다. 사람은 살았지만 영지는 폐허가 되었다. 인구 20% 감소${d.length?`, ${d.join(', ')} 파손`:''}.`}
  g.pop*=.98;const lf=Math.round(g.food*.4);g.food-=lf;const d=damageFac(s>=2?2:1);g.threat-=5;
  return `주민들은 성 안으로 피했다. 식량 -${lf}${d.length?`, ${d.join(', ')} 파손`:''}.`;
}
function precursorCard(s){
  return {tag:'전조',title:'불길한 징조',text:`보좌관이 급히 들어온다. “${pk(PRECURSOR)}”\n\n${SCALE[s]}이 다가오고 있다. 한두 달 안에 닥칠 것이다.`,choices:[
    chP('방비를 서두른다 (금화 50)',pv(80+finMod()),()=>{g.gold-=50;g.prep=true;return '목책을 세우고 화살을 쌓았다. 다가올 침공에서 방어력이 오른다.'},()=>{g.gold-=50;return '서두른 공사가 엉성하게 끝났다.'}),
    chP('정찰대를 보내 무리를 흩뜨린다',pv(40+milMod()+teamPow()),()=>{g.threat-=15;if(g.pending&&g.pending.scale>0)g.pending.scale--;return '정찰대가 선봉을 기습했다. 침공 규모가 한 단계 줄었다.'},()=>{g.troops-=10;return '정찰대가 돌아오지 않았다. 군사력 -10.'}),
    ch('기다린다',()=>'영주는 성벽 위에서 숲을 바라보았다.')]};
}

/* ================= 전쟁과 외교 ================= */
function opp(n){const a=alignOf(g.karma),b=alignOf(n.karma);return a!=='neutral'&&b!=='neutral'&&a!==b}
function casus(n){return n.rel<=-30||opp(n)||g.flags.dispute===n.id||n.emp==='frost'}
function startWar(n){n.status='war';n.trade=false;n.nonAgg=false;n.ally=false;g.wars.push({id:n.id,name:n.name,power:Math.round(n.power),enemyRes:100,ourRes:100})}
function endWar(w){g.wars=g.wars.filter(x=>x!==w);if(w.coalition){(w.members||[]).forEach(id=>{const n=nbById(id);if(n&&n.status==='war'){n.status='peace';n.rel=-40}})}else{const n=nbById(w.id);if(n&&n.status==='war')n.status='peace'}}
function visitCard(){
  const cs=kn().filter(n=>n.status==='peace').map(n=>chP(`${n.name} 방문 (${n.lord})`,pv(55+dipMod()+winter()),()=>{n.rel+=12;g.fame+=1;return `${J(n.lord,'이','가')} 연회를 열어 환대했다. 관계 +12.`},()=>{n.rel-=3;return `${J(n.lord,'은','는')} 바쁘다며 얼굴만 비쳤다. 관계 -3.`},{ap:true,note:`관계 ${n.rel}`}));
  cs.push(cancelCh());return {tag:'외교',title:'이웃 방문',text:'어느 영지를 찾아갈까.',choices:cs};
}
function treatyCard(){
  const cs=[];
  kn().filter(n=>n.status==='peace').forEach(n=>{
    if(!n.trade)cs.push(chP(`${n.name}와 교역 협정`,pv(60+dipMod()/2+finMod()),()=>{n.trade=true;n.rel+=5;return `상단이 오가기 시작했다. 매달 금화 +${n.tb||15}.`},()=>'조건이 맞지 않아 결렬되었다.',{ap:true,disabled:n.rel<20,note:'관계 20 필요'}));
    if(!n.nonAgg)cs.push(chP(`${n.name}와 불가침 조약`,pv(55+dipMod()/2),()=>{n.nonAgg=true;return '서로의 국경을 넘지 않기로 맹세했다.'},()=>'상대가 조약문에 서명하지 않았다.',{ap:true,disabled:n.rel<40,note:'관계 40 필요'}));
    if(!n.ally)cs.push(chP(`${n.name}와 혼인 동맹 (금화 100)`,pv(45+dipMod()/2),()=>{g.gold-=100;n.ally=true;n.nonAgg=true;n.rel+=10;return '두 가문이 혼인으로 이어졌다. 전쟁에서 원군을 보내 줄 것이다.'},()=>{g.gold-=50;return '혼담이 깨졌다. 예물 금화 -50.'},{ap:true,disabled:n.rel<60||g.gold<100,note:'관계 60 필요'}));
  });
  cs.push(cancelCh());return {tag:'외교',title:'조약 체결',text:'어떤 조약을 맺을까.',choices:cs};
}
function declareCard(){
  const cs=kn().filter(n=>n.status==='peace'&&!n.ally).map(n=>ch(`${n.name}에 선전포고`,()=>{const c=casus(n);if(!c){g.fame-=10;g.favor-=10;addKarma(-8)}startWar(n);return `${n.name}과의 전쟁이 시작되었다.${c?' 명분이 있는 전쟁이다.':' 명분 없는 침략에 제국과 백성의 눈길이 싸늘하다. 명성 -10, 제국 충성도 -10.'}`},{ap:true,note:casus(n)?'명분 있음':'명분 없음: 명성과 카르마 하락'}));
  cs.push(cancelCh());return {tag:'외교',title:'선전포고',text:'칼을 뽑을 상대를 고른다. 전쟁 중에는 세수와 식량이 줄고, 마물 방어에 쓸 병력도 묶인다.',choices:cs};
}
function empPower(){return Math.round(280+g.year*20+kn().filter(n=>n.emp==='aurelia'&&n.status==='peace').reduce((a,n)=>a+n.power,0)*.3)}
function rebelCard(){
  const oath=!!g.flags.oathTurn;const ep=empPower();
  return {tag:'반역',title:'제국에 반기를 든다',kind:'battle',text:`아우렐리아 제국군은 대륙에서 가장 강하다. 황제의 기사단, 궁정 마법사, 그리고 제국에 충성하는 영지들이 모두 칼을 들 것이다.${oath?'\n\n당신은 황제에게 충성을 맹세했다. 그 맹세를 깨면 영지에 깊은 업이 남는다.':''}\n\n제국군의 기세: ${foeWord(ep)}. 패하면 반역자로 처형된다.`,choices:[
    ch('반기를 든다',()=>{if(oath)addKarma(-12);g.favor=0;g.fame+=5;g.wars.push({id:'empire',name:'아우렐리아 제국군',power:ep,enemyRes:220,ourRes:100,empire:true});const gd=g.chars.find(c=>c.id==='gideon'&&c.align!=='evil');let t=`영지 곳곳에서 황제의 문장이 찢겨 나갔다. 제국과의 전쟁이 시작되었다.${oath?' 맹세를 깬 영주의 이름 앞에 백성들이 수군거린다.':''}`;if(gd){leave(gd,'황제에 대한 반역에 등을 돌림');t+='\n\n기드온이 근위대장의 망토를 여미고 말없이 떠났다.'}return t}),
    cancelCh('아직은 때가 아니다')]};
}
const myPow=()=>g.troops+teamPow()*3;

    return `${J(n.lord,'이','가')} 너그럽게 웃으며 서약을 받아들였다. 앞으로 12개월 동안 ${n.name}의 속국이다. 세수의 30%를 바치는 대신, 다른 이웃들은 감히 칼을 들지 못하고, 종주국에 인재를 청할 수 있다. 명성 -10.`},
    ()=>{n.rel-=5;return `${J(n.lord,'이','가')} 서약서를 비웃으며 돌려보냈다. “그대 영지는 지켜 줄 가치도 없소.” 관계 -5.`},{ap:true,note:`관계 ${n.rel}, 전력 ${n.power>my*2?'압도적':'우리보다 강함'}`}));
  if(!cs.length)return infoCard('외교','속국을 자청한다','우리보다 강한 이웃을 아직 알지 못한다.','돌아간다');

}
function loanCard(){

function loanReturn(){g.chars.filter(c=>c.loan).forEach(c=>{if(c.loyalty>=80){g.stayQ=g.stayQ||[];g.stayQ.push(c.uid)}else leave(c,'파견 기간이 끝나 종주국으로 복귀')})}

    ch('돌려보낸다',()=>{leave(c,'종주국으로 복귀');return '그는 아쉬운 얼굴로 고개를 숙이고 떠났다.'})]};
}

/* ================= 사건 대기열 ================= */
function buildQueue(){
  const q=[];const P=f=>q.push(f);
  if(g.morale<=0)P(rebellionCard);
  if(g.stayQ&&g.stayQ.length){const sq=g.stayQ.splice(0);sq.forEach(u=>P(()=>stayCard(u)))}
  if(g.breakQ&&g.breakQ.length){const bq=g.breakQ.splice(0);bq.forEach(q=>P(()=>brokenCard(q)))}
  if(g.jobQ&&g.jobQ.length){const qs=g.jobQ.splice(0);qs.forEach(q=>P(()=>classCard(q)))}
  {let qd=false;g.chars.forEach(c=>{if(qd||!QUESTS[c.id]||c.qEnd)return;if(c.qcd&&g.turn<c.qcd)return;const S=qStep(c);if(!S)return;if(S.need(g,c)&&R()<.35){qd=true;P(()=>{if(!g.chars.includes(c))return null;const S2=qStep(c);if(!S2)return null;c._qd=S2!==QUESTS[c.id][c.q||0];return S2.card(c)})}})}
  g.chars.forEach(c=>{const e=c.named&&!c.evolved&&evoOf(c);if(e&&e.c(g,c))P(()=>evoCard(c))});
  if(g.pending){g.pending.t--;if(g.pending.t<=0){const s=g.pending.scale;g.pending=null;P(()=>invasionCard(s))}}
  else if(g.turn>2&&g.demonRel<4){const s=scaleOf(g.threat);if(R()<[.18,.22,.25,.3][s]){if(s>=2){const det=g.advisor==='broker'||hasNamed('amir')||R()<.55+g.fac.watch*.1;g.pending={scale:s,t:ri(1,2),det};if(det)P(()=>g.pending?precursorCard(g.pending.scale):null)}else P(()=>invasionCard(s))}}
  let decl=false;if(g.vassal<=0&&g.turn>10&&!g.wars.length)kn().forEach(n=>{if(decl)return;if(n.status!=='peace'||n.nonAgg||n.ally)return;const mine=g.troops+teamPow()*3;const p=1+D().war+(n.rel<-20?3:0)+(mine<n.power*.6?2:0)+(opp(n)?2:0)+(g.flags.lostInv?3:0)+(n.per==='탐욕'?1:n.per==='신중'?-1:0);if(R()*100<p*distF(n)){decl=true;P(()=>declaredCard(n))}});
  kn().forEach(n=>{if(n.status==='vassal'&&n.rel<-30&&R()<.06+(-30-n.rel)/500)P(()=>vassalRevoltCard(n))});
  g.wars.forEach(w=>{w.turns=(w.turns||0)+1;if(w.empire||w.inq){if(R()<(w.inq?.55:.6))P(()=>g.wars.includes(w)?offensiveCard(w):null);return}if(!w.coalition&&w.turns>=6&&R()<.2)P(()=>g.wars.includes(w)?peaceOfferCard(w):null);else if(R()<.4)P(()=>g.wars.includes(w)?offensiveCard(w):null)});
  if(g.karma<=-50&&g.demonRel<2&&R()<.1+(-50-g.karma)/250+g.threat/600+(g.flags.trace||0)*.05)P(demonMeetCard);
  else if(g.demonRel===2&&g.karma<=-60&&R()<.12)P(allianceCard);
  if(g.demonRel>=2&&R()<.15)P(demandCard);
  if(g.demonRel>=2&&!g.flags.discovered&&R()*100<g.demonRel*3+(g.karma<-60?3:0)-g.security/25)P(inquisitionCard);
  if(g.source===2&&!g.asmorDown&&g.demonRel<3&&R()<.2)P(asmorCard);
  if(g.karma<=-30&&g.turn>=8&&!hasNamed('serion')&&!g.deadNamed.includes('serion')&&R()<.07)P(serionHuntCard);
  if(g.karma<=-30&&R()<.04+g.hostiles*.02)P(accusationCard);
  if(hasNamed('rowen')&&g.demonRel>=2&&g.karma>-50&&!g.flags.reconciled&&R()<.15)P(reconcileCard);
  if(hasNamed('serion')&&hasNamed('bargul')&&R()<.25)P(rivalCard);
  if(g.conflicts.length){const uid=g.conflicts[0];g.conflicts=[];P(()=>{const c=g.chars.find(x=>x.uid===uid);return c?conflictCard(c):null})}
  if(kn().filter(n=>n.status==='absorbed'||n.status==='vassal').length>=4&&!g.independent&&(!g.flags.oathTurn||g.turn-g.flags.oathTurn>=24))P(independenceCard);
  if(g.advisor==='oddmage'&&R()<.12)P(cardOddmage);
  if(g.karma>=70&&R()<.08)P(cardPilgrim);
  const rnd=()=>{const e=wpick(EVENTS,e=>e.w());return e?e.c():null};
  if(q.length<4){P(rnd);if(R()<.4&&q.length<4)P(rnd)}
  g.queue=q;
}
function endMonth(){if(!g||g.card||g.busy||g.phase!=='action')return;g.phase='event';g.lastResult=null;buildQueue();nextEvent()}
function nextEvent(){
  if(g.endingNow){showEnding();return}
  while(g.queue.length){const f=g.queue.shift();const card=f();if(card){card.onDone=null;showCard(card);return}}
  settle();
}

/* ================= 정산 ================= */
function settle(){
  g.report=[];const s=seasonOf(g.month);const atWar=g.wars.length>0;
  let tg=Math.max(1,Math.round(4+(s==='여름'?3:0)-g.fac.watch*.6));if(g.demonRel>=4)tg=0;else if(g.demonRel>=3)tg=Math.round(tg/2);g.threat+=Math.max(0,g.demonRel>=4?0:tg+D().th);
  let inc=25+g.pop*TAX[g.tax].r*1.5+g.fac.market*35+kn().filter(n=>n.trade&&n.status==='peace').reduce((a,n)=>a+(n.tb||15),0)+kn().filter(n=>n.status==='absorbed').length*40+kn().filter(n=>n.status==='vassal').reduce((a,n)=>a+Math.round(n.power*.5),0)+(g.advisor==='steward'?10:0);
  if(atWar)inc*=.8;
  if(g.vassal>0){inc*=.7;g.vassal--;if(g.vassal===0){g.report.push('속국 의무가 끝났다. 다시 자유로운 영지다.');loanReturn();g.overlord=null}}
  g.chars.filter(c=>c.loan).forEach(c=>{if(R()<.04)leave(c,'종주국의 부름을 받고 복귀')});
  const up=(g.troops*.35+g.chars.reduce((a,c)=>a+salary(c),0)+facSum()*2)*D().up;
  const dg=Math.round(inc-up);g.gold+=dg;
  const sm={봄:1,여름:1.1,가을:2.2,겨울:.3}[s];
  const prod=(50+g.fac.farm*35+g.pop/25)*sm*(atWar?.85:1);const cons=(g.pop/10+g.troops/4)*(s==='겨울'?1.3:1);
  const df=Math.round(prod-cons);g.food+=df;
  if(g.food<0){g.food=0;g.pop*=.95;g.morale-=10;g.report.push('식량이 바닥나 굶주린 이들이 영지를 떠났다.')}
  g.morale+=TAX[g.tax].m+Math.round(g.fac.church*.6)+(g.security<30?-3:0);
  if(g.tax===3)addKarma(-2);
  const el=g.chars.find(c=>c.id==='elina'&&!c.injured&&c.post);if(el&&el.align!=='evil'){g.morale+=1;g.security+=1}
  g.security-=1;const gd=postHolder('guard');if(gd)g.security+=Math.round(powerOf(gd)/5)+1;
  if(g.morale>=50&&df>=0)g.pop*=1.015;else if(g.morale<30)g.pop*=.985;
  g.mana+=g.fac.tower*2;const rs=postHolder('research');if(rs){g.mana+=Math.max(1,Math.round(powerOf(rs)/4));addExp(rs,3)}
  g.chars.slice().forEach(c=>{
    if(c.injured>0){c.injured--;if(!c.injured)c.hp=Math.max(c.hp,60)}
    c.hp=Math.min(100,c.hp+15);
    c.loyalty+=c.post?1:-1;if(g.gold<0)c.loyalty-=5;
    const d=g.karma-c.karma;c.karma+=d*.05*(.5+c.loyalty/100)*(1-c.conv);
    const al=alignOf(c.karma);if(al!==c.align)transform(c,al);
    const ad=Math.abs(g.karma-c.karma);
    if(ad>=60){let p=.06*(1.2-c.loyalty/100);if(c.id==='elina'&&g.karma<=-30)p*=2;if(R()<p){leave(c,'성향 갈등');return}if(R()<.15)g.conflicts.push(c.uid)}
    else if(ad>=30&&R()<.1)g.conflicts.push(c.uid);
    if(c.loyalty>=80&&!c.openHint&&!c.renamed){c.openHint=true;g.report.push(`${J(dispName(c),'이','가')} 영주에게 마음을 열었다. 인재 탭에서 새 이름을 지어 줄 수 있다.`)}
    if(c.loyalty<15&&R()<.25)leave(c,'쌓인 불만');
  });
  kn().forEach(n=>{if(n.status==='absorbed')return;if(n.status==='vassal'){n.rel-=1;if((n.talent||[]).length<2&&R()<.06){n.talent=n.talent||[];n.talent.push(...genTalent(n).slice(0,1))}}n.power+=.6;if(opp(n))n.rel-=2;else if(alignOf(g.karma)!=='neutral'&&alignOf(g.karma)===alignOf(n.karma))n.rel+=1;if(n.trade)n.rel+=1});
  if(g.shadow){g.shadow.t--;if(R()<.12){g.pop*=.95;g.morale-=10;g.shadow=null;g.report.push('그림자 병사들이 등을 돌려 마을을 덮치고 사라졌다. 인구와 민심이 크게 떨어졌다.')}else if(g.shadow.t<=0){g.shadow=null;g.report.push('그림자 병사들이 약속대로 땅속으로 스며들었다.')}}

  let pines='';for(let x=-10;x<1210;x+=21){if(x>490&&x<760)continue;const h=26+((x*37)%29);pines+=`M${x} 240L${x+11} ${208-h}L${x+22} 240Z`}
  const castle='M520 240V160h18v-12h10v12h14v-34h12v-10h8v10h12v34h16V138l20-28 20 28v22h16v-34h12v-10h8v10h12v34h14v-12h10v12h18v80Z';
  return `<svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice"><path d="M0 170L130 126L240 156L360 104L480 150L610 112L740 156L870 108L990 146L1110 116L1200 136V240H0Z" fill="currentColor" opacity=".5"/><path d="${pines}" fill="currentColor"/><path d="${castle}" fill="currentColor"/></svg>`;
}

function saveTo(i,silent){
  if(!canSave())return false;

  g.fac.sanctum=g.fac.sanctum||0;g.fac.torture=g.fac.torture||0;g.prison=g.prison||[];

function renameText(t,o,n){
  const P={'은':['은','는'],'는':['은','는'],'이':['이','가'],'가':['이','가'],'을':['을','를'],'를':['을','를'],'과':['과','와'],'와':['과','와']};
  const esc_=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return [o,o.split(' ')[0]].reduce((acc,nm)=>acc.replace(new RegExp(esc_(nm)+'(은|는|이|가|을|를|과|와)?','g'),(m,j)=>n+(j?(bat(n)?P[j][0]:P[j][1]):'')),t);
}

}
function cardHTML(c){
  let h=`<article class="scroll ${c.kind?'k-'+c.kind:''} ${c.drawn?'still':''}"><i class="knob tl"></i><i class="knob tr"></i><i class="knob bl"></i><i class="knob br"></i><div class="paper ${c.drawn?'':'rolled'}"><header class="scroll-head"><div class="emblem">${icon(KIND_IC[c.kind]||'scroll')}</div><div><div class="tag">${esc(c.tag||'사건')}</div><h2>${esc(c.title)}</h2></div></header><div class="scroll-body"><div class="story">${para(c.text)}</div>`;
  if(!c.result&&c.signing!=null){h+=contractHTML(c)}
  else if(!c.result&&c.busy){
    const x=c.choices[c.chosen];
    h+=`<div class="result"><div class="chosen">${esc(x.label)}</div>${c.sigImg?`<div class="signed"><img src="${c.sigImg}" alt="영주의 서명"><span>서명한 계약서를 건넸다.</span></div>`:''}<div class="judging"><span class="wax busy">판정</span><span>운명의 주사위가 구르고 있다…</span></div></div>`;
  }
  else if(!c.result){
    if(isBattleCard(c))h+=rosterHTML();
    h+='<div class="choices">';
    c.choices.forEach((x,i)=>{
      const noAp=x.ap&&g.ap<=0;const dis=chDisabled(x)||c.busy||noAp;const sel=c.busy&&c.chosen===i;const pp=chP_(x);
      const notes=[x.note,x.sign?'계약서에 서명한다':'',x.ap?'행동력 1':'',noAp?'행동력이 없다':'',x.mage&&noMage()?'출전 명단에 마법사가 없거나 마력 기반이 부족하다':''].filter(Boolean).join(', ');
      const seal=sel?'<span class="wax busy">판정</span>':pp!=null?`<span class="wax ${pClass(pp)}">${pLabel(pp)}</span>`:'';
      h+=`<button class="choice ${sel?'sel':''}" ${dis?'disabled':''} onclick="choose(${i})"><span class="cl">${esc(x.label)}${notes?`<small>${esc(notes)}</small>`:''}</span>${seal}</button>`;
    });
    h+='</div>';
  }else{
    const r=c.result;const L=r.lines||[];const done=!L.length||c.reveal>=L.length;
    h+=`<div class="result ${c.resShown?'still':''}"><div class="chosen">${esc(c.choices[c.chosen].label)}</div>`;
    if(L.length)h+=`<ol class="blog">${L.slice(0,c.reveal).map((l,i)=>`<li class="${l.c||''}${i===c.reveal-1&&!done?' fresh':''}${i===L.length-1&&c.reveal===L.length&&!c.lastShown?' fresh':''}">${esc(l.t)}</li>`).join('')}${done?'':'<li class="pending">…</li>'}</ol>`;
    if(done){h+=`<div class="story ${L.length&&!c.textShown?'fresh':''}" style="margin-top:${L.length?'14px':'0'}">${para(r.text)}</div>`}
    c.resShown=true;if(done&&L.length){c.lastShown=true;c.textShown=true}
    if(done&&c.sigImg)h+=`<div class="signed"><img src="${c.sigImg}" alt="영주의 서명"><span>${g.chars.some(p=>p.sig===c.sigImg)?'서명한 계약서가 보관되었다.':'서명한 계약서는 끝내 받아들여지지 않았다.'}</span></div>`;
    h+=`</div>${done?'<button class="btn gold cont" onclick="cont()">계속</button>':'<button class="btn cont" onclick="skipReveal()">건너뛰기</button>'}`;
  }
  c.drawn=true;
  return h+'</div></div></article>';
}
function peopleHTML(){
  if(!g.chars.length)return '<p class="intro">영지에 인재가 없다. 명령의 인재 항목에서 수소문해 보자.</p>';
  return `<p class="intro">직책에 앉은 인재는 매달 충성도가 오르고, 자리가 없는 인재는 조금씩 불만이 쌓인다. 영지와 성향이 다르면 서서히 영지의 색으로 물든다. 충성도가 80을 넘은 인재에게는 새 이름을 지어 줄 수 있다.</p><div class="people">${g.chars.map(c=>{
    const need=(c.grade+1)*20;const opts=Object.entries(POSTS).filter(([k,p])=>p.t===c.type);
    const holder=k=>{const h=g.chars.find(x=>x.post===k&&x!==c);return h?` (현재 ${dispName(h)})`:''};
    return `<div class="pc ${c.named?'named':''}"><div class="pc-head">${crest(c)}<div><h4>${esc(dispName(c))}</h4><small>${c.type==='knight'?'기사':'마법사'}, ${gradeName(c)}<span class="chip karma-${c.align}">${AL[c.align]}</span>${c.injured?`<span class="chip" style="color:var(--danger)">부상 ${c.injured}개월</span>`:''}${c.broke?'<span class="chip" style="color:var(--trim)">한계 돌파</span>':''}${c.evolved?'<span class="chip" style="color:var(--trim)">각성</span>':''}${c.loan?`<span class="chip" style="color:var(--good)">파견: ${esc((nbById(c.loan)||{name:'종주국'}).name)}</span>`:''}</small></div></div>
      <div class="kv"><span>체력</span><b>${c.hp}</b></div><div class="track"><i style="width:${c.hp}%;background:var(--ok)"></i></div>
      <div class="kv"><span>충성도</span><b>${c.loyalty}</b></div><div class="track"><i style="width:${c.loyalty}%"></i></div>
      <div class="kv"><span>성장</span><b>${Math.min(c.exp,need)} / ${need}</b></div><div class="track"><i style="width:${Math.min(100,c.exp/need*100)}%;background:var(--good)"></i></div>
      ${QUESTS[c.id]?`<div class="kv"><span>개인 이야기</span><b>${c.qEnd?'완결':`${c.q||0} / ${QUESTS[c.id].length}`}${c.q?`, ${QUESTS[c.id][Math.min(c.q,QUESTS[c.id].length)-1].t}`:''}</b></div>`:''}
      <div class="kv"><span>장비</span><b>${c.eq?`+${c.eq} ${eqName(c)}`:`평범한 ${eqName(c)}`}</b></div>
      <div class="kv"><span>급여</span><b>금화 ${salary(c)} / 월</b></div>
      ${c.sig?`<div class="kv"><span>계약서 서명</span></div><img class="sigimg" src="${c.sig}" alt="영주의 서명">`:''}
      ${g.advisor==='broker'?`<div class="appr">라쉬의 감정: “${appraise(c)}”</div>`:''}
      <select onchange="setPost(${c.uid},this.value)" aria-label="직책"><option value="">직책 없음</option>${opts.map(([k,p])=>`<option value="${k}" ${c.post===k?'selected':''}>${p.n}: ${p.d}${esc(holder(k))}</option>`).join('')}</select>
      ${ui.renaming===c.uid?`<div class="rename"><input id="rn" maxlength="12" value="${esc(c.name)}" aria-label="새 이름" onkeydown="if(event.key==='Enter')doRename(${c.uid});if(event.key==='Escape'){ui.renaming=null;render()}"><button class="btn gold" onclick="doRename(${c.uid})">이름을 내린다</button><button class="ghost" onclick="ui.renaming=null;render()">취소</button></div>`:c.loyalty>=80?`<button class="toggle on" onclick="startRename(${c.uid})">새 이름을 지어 준다</button>`:''}
      <button class="toggle ${c.bench?'':'on'}" onclick="toggleBench(${c.uid})">${c.bench?'대기 중. 눌러서 출전 명단에 넣기':'출전 명단에 있음. 눌러서 대기시키기'}</button></div>`}).join('')}</div>`;
}
function facHTML(){
  const cap=facCap();const can=g.phase==='action'&&!g.card&&!g.busy&&g.ap>0;
  return `<p class="intro">시설은 ${FMAX}단계까지 올릴 수 있다. 지금 작위(${RANKS[g.rank]})로는 ${cap}단계까지 지을 수 있고, 작위가 오르면 한계가 늘어난다. 확장할 때마다 행동력 1을 쓴다.</p><div class="facgrid">${Object.keys(FAC).map(k=>{const lv=g.fac[k];const cost=facGold(k,lv),stn=facStone(k,lv);const alk=FAC[k].al&&alignOf(g.karma)!==FAC[k].al;const blocked=lv>=cap||alk;
    return `<div class="fc"><h4>${FAC[k].n}${FAC[k].al?`<span class="chip karma-${FAC[k].al}">${AL[FAC[k].al]} 전용</span>`:''}${lv>0&&!facActive(k)?'<span class="chip" style="color:var(--danger)">작동 정지</span>':''}<small>${lv} / ${FMAX}단계</small></h4><div class="lv">${Array.from({length:FMAX},(_,i)=>`<i class="${i<lv?'on':i>=cap?'lock':''}"></i>`).join('')}</div><p>${FAC[k].d}</p>
    <div class="kv"><span>지금</span><b>${facEffect(k,lv)}</b></div>${lv<FMAX?`<div class="kv"><span>다음 단계</span><b>${facEffect(k,lv+1)}</b></div>`:''}
    ${lv<FMAX?`<button class="btn ${blocked?'':'gold'} fbtn" ${!can||blocked||g.gold<cost||g.stones<stn?'disabled':''} onclick="facBuild('${k}')">${alk?`카르마가 ${AL[FAC[k].al]}일 때만`:blocked?`${RANKS[Math.min(3,g.rank+1)]} 작위 필요`:`${lv+1}단계로 확장, 금화 ${cost}${stn?`, 마석 ${stn}`:''}`}</button>`:''}</div>`}).join('')}</div>${prisonHTML()}`;
}
function diploHTML(){
  const st={peace:'평화',war:'전쟁 중',absorbed:'흡수됨',vassal:'속국'};
  const pw=n=>{const r=n.power/Math.max(1,g.troops+teamPow()*3);return r<.6?'우리보다 약하다':r<1.2?'비슷하다':'우리보다 강하다'};
  let h=`<div class="panel"><div class="kv" style="margin:0"><span>제국 충성도</span><b>${g.favor}</b></div><div class="kv"><span>다음 작위</span><b>${g.rank<3?`${RANKS[g.rank+1]} (명성 ${RANK_REQ[g.rank][0]}, 충성도 ${RANK_REQ[g.rank][1]})`:'최고 작위'}</b></div>${g.vassal>0?`<div class="kv"><span>속국 상태</span><b class="dn">${g.overlord&&nbById(g.overlord)?nbById(g.overlord).name+'의 속국, ':''}${g.vassal}개월 남음</b></div>`:''}${g.demonMet?`<div class="kv"><span>마족 관계</span><b class="karma-evil">${DREL[g.demonRel]}</b></div>`:''}</div><div class="nbs">`;
  kn().slice().sort((a,b)=>a.d-b.d).forEach(n=>{const w=g.wars.find(x=>x.id===n.id||(x.members||[]).includes(n.id));const rl=n.rel;const left=rl<0?50+rl/2:50;const width=Math.abs(rl)/2;
    h+=`<div class="nb"><h4><span>${n.name} <span class="chip" style="color:${EMPIRES[n.emp].c}">${EMPIRES[n.emp].n}</span></span><span class="chip" style="color:var(--${n.status==='war'?'danger':n.status==='absorbed'||n.status==='vassal'?'trim':'neu'})">${st[n.status]}</span></h4>
    <p>영주 ${n.lord}. ${n.per} 성향의 ${AL[alignOf(n.karma)]} 영지. ${n.bio}</p>
    ${n.status!=='absorbed'?`<div class="kv"><span>관계 ${rl}</span><span>전력: ${pw(n)}</span></div><div class="relbar"><i style="left:${left}%;width:${width}%;background:var(--${rl<0?'danger':'ok'})"></i></div>
    <p>${[n.trade?'교역 협정':'',n.nonAgg?'불가침':'',n.ally?'혼인 동맹':'',opp(n)?'성향 대립':'',g.flags.dispute===n.id?'영토 분쟁':''].filter(Boolean).join(', ')||'맺은 조약 없음'}</p>`:''}
    ${n.status==='vassal'?`<p>매달 공물 금화 ${Math.round(n.power*.5)}. 원한이 깊어지면 반란을 일으킨다.</p><p>남은 인재: ${(n.talent||[]).length?n.talent.map(t=>`${esc(dispName(t))} (${gradeName(t)}, ${AL[t.align]})`).join(', '):'없음'}</p>`:''}
    ${w?`<p class="dn">${w.name}: 적 저항 ${Math.max(0,w.enemyRes)}, 아군 저항 ${Math.max(0,w.ourRes)}</p>`:''}</div>`});
  const uk=unknownNb().length;if(uk)h+=`<div class="nb" style="border-style:dashed;background:transparent"><p style="margin:0">아직 알려지지 않은 영지가 ${uk}곳 더 있다. 원방 사절을 보내거나 변경을 탐사하면 찾을 수 있다.</p></div>`;
  return h+'</div>';
}
function chronHTML(){
  const ids=[...Object.keys(NAMED),'asmor'];
  let h=`<h3>네임드 인물</h3><div class="clist">`;
  ids.forEach(id=>{const r=chron.named[id];const d=id==='asmor'?ASMOR:NAMED[id];
    if(!r||!r.met){h+=`<div class="ci unknown"><h4>아직 만나지 못한 이름</h4><p>어딘가에서 당신을 기다리고 있다.</p></div>`;return}
    h+=`<div class="ci"><h4>${d.name}</h4><p>${d.bio}</p><p>만남 ${r.met}회, 영입 ${r.recruited}회, 한계 돌파 목격 ${r.lb}회${r.evo?`, 각성 목격 ${r.evo}회`:''}${r.quest?`, 이야기 완결 ${r.quest}회`:''}${r.job?`, 전직 목격 ${r.job}회`:''}</p>${r.fates.length?`<p>최근의 결말: ${r.fates.slice(-3).map(esc).join(' / ')}</p>`:''}</div>`});
  h+=`</div><h3>대륙의 영주들 ${NEIGHBORS.filter(n=>n.near||chron.lords[n.id]).length} / ${NEIGHBORS.length}</h3><div class="clist">${NEIGHBORS.map(n=>(n.near||chron.lords[n.id])?`<div class="ci"><h4>${n.lord}</h4><p>${n.name}. ${n.bio}</p></div>`:`<div class="ci unknown"><h4>아직 모르는 영주</h4><p>어딘가에 또 다른 깃발이 있다.</p></div>`).join('')}</div>`;
  h+=`<h3>발견한 결말 ${chron.endings.length} / ${Object.keys(ENDINGS).length}</h3><div class="clist">${Object.keys(ENDINGS).map(k=>chron.endings.includes(k)?`<div class="ci"><h4>${ENDINGS[k].t}</h4><p>${ENDINGS[k].k} 결말</p></div>`:`<div class="ci unknown"><h4>닿지 못한 결말</h4></div>`).join('')}</div>`;
  return h;
}
function endingHTML(){
  const E=ENDINGS[g.endingNow];const ep=epilogues();
  return `<div class="ending"><div class="kind">${E.k} 결말</div><h1>${E.t}</h1><div class="story">${para(E.x)}</div>
  <div class="sum"><div>난이도<b>${D().n}</b></div><div>재위<b>${g.year}년차 ${g.month}월</b></div><div>작위<b>${RANKS[g.rank]}</b></div><div>영지의 업<b>${landLabel()}</b></div><div>인구<b>${g.pop}</b></div><div>격퇴한 침공<b>${g.invWins.reduce((a,b)=>a+b,0)}회</b></div></div>
  ${ep.length?`<h3>그 후의 이야기</h3><ul>${ep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <p class="muted" style="text-align:center;margin-top:28px">이 결말과 인물들의 운명은 연대기에 기록되었다.</p>
  <div class="go"><button class="btn gold" onclick="ui.trait=null;ui.advisor=null;goSetup()">새로운 영주로 부임한다</button><button class="btn" onclick="goTitle()">처음으로</button></div></div>`;
}
render();
</script>
